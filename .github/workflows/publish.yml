name: Publish WorkFlow

on:
  release:
    types: [published]
  # Run from main to republish the docs alone; PyPI is published only by a release.
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 🦾 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: 📦 Build package
        run: python setup.py sdist bdist_wheel
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build-slim:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 🦾 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: 📦 Build slim package
        run: |
          rm -rf dist/ build/ *.egg-info
          python setup_slim.py sdist bdist_wheel
      - name: 🚀 Publish roboflow-slim to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  deploy-docs:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # mkdocstrings >= 1.0.7, which works with pymdown-extensions >= 12.2, needs Python >= 3.11.
      # Keep in step with the docs job in test.yml.
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📚 Install MkDocs and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocstrings mkdocstrings[python]
          pip install ".[dev]"

      - name: 🏗️ Build documentation
        run: |
          mkdocs build

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
